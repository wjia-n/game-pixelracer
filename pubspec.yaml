name: pixelracer
description: Pixel Racer by Wajiha - tiny cars, massive drifts.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  in_app_purchase: ^3.2.0
  share_plus: ^10.1.2
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/pixelracer_logo.png
    - assets/wajiha_logo.png
